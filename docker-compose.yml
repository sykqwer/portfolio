version: '3.8'

services:
  portfolio-site:
    build: .
    container_name: portfolio-site
    restart: unless-stopped
    networks:
      - web-network
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
